name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lua, glslang and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 glslang-tools python3-pil

      - name: Shapes submodule checked out
        run: test -n "$(ls -A dots/.config/quickshell/ii/modules/common/widgets/shapes)"

      - name: Static checks
        run: ./scripts/validate.sh

      # The unit tests, with what they drive installed so none of them is skipped: Tesseract and poppler for
      # `halcyon text`, Qt's QML test runner (with Shapes) for the revolver and the sun dial, and Markdown for the
      # docs site.
      - name: Install the test tools
        run: |
          sudo apt-get install --no-install-recommends -y \
            tesseract-ocr tesseract-ocr-eng poppler-utils fonts-dejavu-core python3-markdown \
            qml-qt6 qml6-module-qtquick qml6-module-qtquick-shapes qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qttest qt6-qpa-plugins

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PATH: /usr/lib/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: python3 -m unittest discover -s tests -v
