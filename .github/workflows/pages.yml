name: Docs site

# Builds docs/ into the site at https://trail-b1az3r.github.io/dots/ and publishes it with GitHub Pages.
# Every push builds it, so a broken page shows up in review; only the default branch publishes it.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "dots/.config/hypr/hyprland/halcyon/themes/wallpapers/red-sun.jpg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown and Pillow
        run: python -m pip install "markdown==3.7" "pillow>=10"

      - name: Build the site
        run: python docs/site/build.py --out _site --base-url "https://trail-b1az3r.github.io/dots/"

      - name: Check the links
        run: python -m unittest tests/test_docs_site.py -v

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
