# Halcyon — lock screen.
#
# hyprlock still uses hyprlang (the `key = value` format), not Lua: it is
# a separate program from the compositor and has its own release cycle.
#
# Colours come from `$XDG_CONFIG_HOME/halcyon/generated/hyprlock-colors.conf`,
# which `halcyon theme apply` writes from your wallpaper. Everything else
# is here and yours to edit.

$colors = $XDG_CONFIG_HOME/halcyon/generated/hyprlock-colors.conf
source = $colors

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = halcyonOut, 0.0, 0.0, 0.2, 1.0
    animation = fadeIn, 1, 3, halcyonOut
    animation = fadeOut, 1, 3, halcyonOut
    animation = inputFieldDots, 1, 1.4, linear
}

background {
    monitor =
    path = screenshot
    # Blurring the desktop rather than showing a separate image keeps the
    # lock screen continuous with what was on screen a moment ago — the
    # same trick that makes the glass panels read as depth.
    blur_passes = 4
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

# Time
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $hal_text
    font_size = 108
    font_family = $hal_font_ui
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $hal_shadow
    shadow_boost = 0.7
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %e %B"
    color = $hal_text_secondary
    font_size = 19
    font_family = $hal_font_ui
    position = 0, 108
    halign = center
    valign = center
}

# Now playing — only rendered when something is actually playing.
label {
    monitor =
    text = cmd[update:5000] playerctl --format '{{status}}' status 2>/dev/null | grep -q Playing && playerctl --format '󰎈  {{title}} — {{artist}}' metadata 2>/dev/null || echo ""
    color = $hal_text_tertiary
    font_size = 14
    font_family = $hal_font_ui
    position = 0, 66
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.42
    dots_center = true
    dots_rounding = -1
    rounding = 26

    outer_color = $hal_border
    inner_color = $hal_surface
    font_color = $hal_text
    check_color = $hal_accent
    fail_color = $hal_danger
    capslock_color = $hal_warning

    fade_on_empty = false
    placeholder_text = <span foreground="##$hal_text_tertiary_rgb">Enter password</span>
    fail_text = <span foreground="##$hal_danger_rgb">$FAIL ($ATTEMPTS)</span>
    hide_input = false

    position = 0, -60
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 12
    shadow_color = $hal_shadow
    shadow_boost = 0.5
}

# Battery, on machines that have one.
label {
    monitor =
    text = cmd[update:30000] test -d /sys/class/power_supply/BAT0 && printf '󰁹 %s%%' "$(cat /sys/class/power_supply/BAT0/capacity)" || echo ""
    color = $hal_text_tertiary
    font_size = 13
    font_family = $hal_font_ui
    position = -28, -24
    halign = right
    valign = top
}

# Who is logged in.
label {
    monitor =
    text = $USER
    color = $hal_text_secondary
    font_size = 14
    font_family = $hal_font_ui
    position = 0, -128
    halign = center
    valign = center
}
