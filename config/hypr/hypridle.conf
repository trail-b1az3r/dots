# Halcyon — idle behaviour.
#
# hypridle uses hyprlang, like hyprlock. The timeouts here are the
# fallback: `halcyon power watch` rewrites
# ~/.config/halcyon/generated/hypridle-timeouts.conf from your Battery
# settings, and that file wins because it is sourced after these.
#
# The ordering matters: dim, then screen off, then lock, then sleep. Each
# step is recoverable by moving the mouse until the lock happens.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim the backlight. Cheap, reversible, and the first sign that the
# machine is about to do something.
listener {
    timeout = 300
    on-timeout = halcyon backlight 15
    on-resume = halcyon backlight 100
}

# Turn the keyboard backlight off before the screen: it is the part
# nobody misses.
listener {
    timeout = 330
    on-timeout = halcyon action keyboard.brightness percent=0
    on-resume = halcyon action keyboard.brightness percent=60
}

# Screen off. This is where the real power saving happens.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

source = $XDG_CONFIG_HOME/halcyon/generated/hypridle-timeouts.conf
