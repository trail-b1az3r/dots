<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="Halcyon: a Hyprland desktop built on end-4's illogical-impulse, with hand-made themes, a voice assistant and hyprland-plus.">
<meta name="color-scheme" content="dark light">
{{canonical}}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ff4940' stroke-width='4' stroke-dasharray='48 6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{root}}assets/style.css">
<script>try{var t=localStorage.getItem("halcyon-docs-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="page{{home_class}}">
<a class="skip" href="#content">Skip to the content</a>
<header class="topbar">
  <button class="icon-button menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Pages">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="{{root}}index.html">
    <svg class="brand-ring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10"/></svg>
    <span>Halcyon</span>
  </a>
  <span class="spacer"></span>
  <a class="top-link" href="https://trail-b1az3r.github.io/hyprland-plus/">hyprland-plus wiki</a>
  <a class="top-link" href="https://github.com/trail-b1az3r/dots">GitHub</a>
  <button class="icon-button theme-toggle" type="button" aria-label="Switch between light and dark">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>
{{hero}}
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav aria-label="Pages">{{nav}}</nav>
  </aside>
  <main id="content" class="content">
    <article class="prose">
{{body}}
    </article>
    <footer class="page-foot">
      <a href="{{edit}}">Edit this page on GitHub</a>
      <span>Halcyon is built on <a href="https://github.com/end-4/dots-hyprland">end-4's illogical-impulse</a>. GPL-3.0.</span>
    </footer>
  </main>
  <aside class="aside">{{toc}}</aside>
</div>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
