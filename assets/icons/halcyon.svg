<?xml version="1.0" encoding="UTF-8"?>
<!--
  Halcyon's mark.

  Three stacked chevrons in one flat tile: the brightest on top and two
  fading layers beneath it, like panes of glass stacked on a surface. The
  name is the halcyon, the calm bird that brings still water; the mark
  reads as a lifted, settled shape rather than a picture of a bird.

  Colours are explicit, not currentColor. An SVG loaded as an image has no
  surrounding text colour to inherit, so currentColor resolves to black and
  the mark disappears on a dark background. The tile is the Halcyon
  default accent, which reads on both light and dark wallpapers.

  Built to stay legible at 16 px: a single flat shape, no gradients, no
  blend modes, no filters. Qt's SVG renderer is not required — the shell
  loads halcyon.png; this file is the master.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Halcyon</title>

  <!-- The tile. -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#0a84ff"/>

  <!-- Three layers, brightest on top. Round caps and joins keep the
       chevrons soft at every size. -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 31 L32 16 L48 31" stroke-opacity="1"/>
    <path d="M16 41 L32 26 L48 41" stroke-opacity="0.7"/>
    <path d="M16 51 L32 36 L48 51" stroke-opacity="0.4"/>
  </g>
</svg>
