[package]
name = "halcyon-forecast"
version = "1.0.0"
edition = "2021"
description = "Summit's forecast window: the week's weather where you are, as halcyon_weather.py last fetched it"
license = "GPL-3.0-only"
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 4
