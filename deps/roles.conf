# Halcyon dependency roles.
#
# One role per line:
#   role | tier | probe | description
#
# tier    core     — the desktop will not start without it
#           shell  — a major surface degrades but the desktop still works
#           extra  — optional polish
#           ai     — optional, only needed for the assistant
# probe   a shell command that exits 0 when the role is satisfied.
#         `cmd:<name>` is shorthand for "this binary is on PATH".
#         `any:<a>,<b>` is satisfied by any one of the listed binaries.
#         `lib:<pkgconfig>` asks pkg-config.
#         `file:<path>` checks for a path.

hyprland      | core  | cmd:Hyprland                       | Wayland compositor (0.56+, Lua config)
hyprctl       | core  | cmd:hyprctl                        | Hyprland control client
quickshell    | core  | any:quickshell,qs                  | QtQuick shell toolkit (0.3+)
waybar        | core  | cmd:waybar                         | Status bar
python        | core  | cmd:python3                        | Runtime for halcyon's own tooling
pipewire      | core  | cmd:pipewire                       | Audio server
wireplumber   | core  | cmd:wireplumber                    | PipeWire session manager
wpctl         | core  | cmd:wpctl                          | PipeWire volume control
portal        | core  | file:/usr/libexec/xdg-desktop-portal-hyprland | Screencast/file portal for Hyprland
polkit-agent  | shell | any:hyprpolkitagent,polkit-kde-authentication-agent-1,lxpolkit | Graphical privilege prompts
hyprlock      | shell | cmd:hyprlock                       | Session lock
hypridle      | shell | cmd:hypridle                       | Idle management
wl-clipboard  | shell | cmd:wl-copy                        | Wayland clipboard access
cliphist      | extra | cmd:cliphist                       | Clipboard history for Spotlight
grim          | shell | cmd:grim                           | Screenshot capture
slurp         | shell | cmd:slurp                          | Region selection
screenrecord  | extra | any:wf-recorder,wl-screenrec       | Screen recording
brightnessctl | shell | cmd:brightnessctl                  | Backlight control
playerctl     | extra | cmd:playerctl                      | MPRIS control for Waybar
networkmanager| shell | cmd:nmcli                          | Network management
bluez         | shell | cmd:bluetoothctl                   | Bluetooth
upower        | shell | cmd:upowerd                        | Battery information
libnotify     | extra | cmd:notify-send                    | Sending desktop notifications
imagemagick   | shell | any:magick,convert                 | Wallpaper processing and palette extraction
wallpaper     | shell | any:swww,hyprpaper                 | Wallpaper daemon
fonts-ui      | shell | file:FONT_UI                       | UI typeface (Inter / SF-like)
fonts-mono    | extra | file:FONT_MONO                     | Monospace typeface
fonts-symbols | extra | file:FONT_SYMBOLS                  | Icon glyph font for Waybar
powerprofiles | shell | any:powerprofilesctl,tlp,tuned-adm | Power profile daemon
ollama        | ai    | cmd:ollama                         | Local LLM runtime for the fallback assistant
piper         | ai    | any:piper,piper-tts                | Local text-to-speech
whisper       | ai    | any:whisper-cli,whisper-cpp        | Local speech-to-text
nixorb        | ai    | cmd:nixorb                         | NixOrb assistant backend
hypernix      | extra | any:hypernix,hnx                   | HyperNix toolkit integration
