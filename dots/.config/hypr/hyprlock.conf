# The lock screen when the shell's own isn't there (Halcyon locks with Quickshell first; see hypridle.conf).
# Colours come from the theme or the wallpaper (hyprlock/colors.conf, written by matugen); the defaults below are
# only for a colors.conf from before they existed.
$accent_color = rgba(B9C6E8FF)
$accent_soft = rgba(B9C6E855)
$check_color = rgba(FFD86BFF)
$fail_color = rgba(FFB4ABFF)
$card_color = rgba(131B2EB8)
$shadow_color = rgba(00000099)
$background_image = screenshot
source=~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = halcyon, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, halcyon
    animation = fadeOut, 1, 4, halcyon
    animation = inputFieldDots, 1, 2, halcyon
}

# What was on the screen, blurred and dimmed.
background {
    monitor =
    path = screenshot
    color = rgba(101010FF)
    blur_passes = 3
    blur_size = 9
    noise = 0.012
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.2
}

# The clock: large and light, with a soft shadow.
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 110
    font_family = $font_family_clock
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow_color
    position = 0, 250
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $accent_color
    font_size = 20
    font_family = $font_family
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow_color
    position = 0, 150
    halign = center
    valign = center
}

# The card behind the user and the password.
shape {
    monitor =
    size = 360, 250
    color = $card_color
    rounding = 28
    border_size = 1
    border_color = $accent_soft
    shadow_passes = 2
    shadow_size = 10
    shadow_color = $shadow_color
    position = 0, -100
    halign = center
    valign = center
}

image { # Your picture (~/.face), round
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 2
    border_color = $accent_color
    position = 0, -25
    halign = center
    valign = center
}

label { # Greeting
    monitor =
    text = cmd[update:60000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/greeting.sh
    color = $text_color
    font_size = 15
    font_family = $font_family
    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    rounding = 25
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent_soft
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>Not that one</i>
    capslock_color = $check_color
    placeholder_text = <span alpha="60%">Password</span>
    fade_on_empty = false
    position = 0, -165
    halign = center
    valign = center
}

label { # Caps Lock
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $check_color
    font_size = 12
    font_family = $font_family
    position = 0, -240
    halign = center
    valign = center
}

label { # What is playing
    monitor =
    text = cmd[update:2000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/playing.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, 60
    halign = center
    valign = bottom
}

label { # Battery and the like
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

label { # Keyboard layout
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}
