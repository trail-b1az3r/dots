$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
    # Halcyon's server mode holds a systemd idle lock: while it does, none of the timers below run.
    ignore_systemd_inhibit = false
}

# A minute before locking, the screen dims and the keyboard light goes out, so you see it coming. Touch anything
# and both come back as they were (brightnessctl -s saves the level, -r restores it).
listener {
    timeout = 240 # 4 mins
    on-timeout = command -v brightnessctl >/dev/null && brightnessctl -s set 15%
    on-resume = command -v brightnessctl >/dev/null && brightnessctl -r
}

listener {
    timeout = 240 # 4 mins
    on-timeout = command -v brightnessctl >/dev/null && brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = command -v brightnessctl >/dev/null && brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 300 # 5 mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15 mins
    on-timeout = $suspend_cmd
}
