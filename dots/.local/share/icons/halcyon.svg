<?xml version="1.0" encoding="UTF-8"?>
<!--
  Halcyon's mark: a darkened, slightly cracked arch with a sword and a
  trident standing inside it.

  The arch is an original pointed shape, not the Arch Linux logo, which is
  that project's trademark. The cracks are drawn as lines, not gradients,
  so the mark stays one flat design at every size.

  Colours are explicit, not currentColor, so the mark keeps its contrast
  when an icon loader places it on a light or a dark background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Halcyon</title>

  <!-- The arch: a pointed silhouette, darkened. -->
  <path d="M128 12 C150 52 212 88 226 152 L236 244 L20 244 L30 152 C44 88 106 52 128 12 Z"
        fill="#14171E" stroke="#2A303C" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cracks running down from the peak, drawn as broken lines. -->
  <g fill="none" stroke="#4A5366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M122 58 L116 80 L127 94 L117 112 L124 126"/>
    <path d="M134 74 L142 96 L133 116 L146 132"/>
    <path d="M96 150 L108 166 L100 186 L112 200"/>
    <path d="M166 170 L156 188 L168 204"/>
  </g>

  <!-- The weapons, in pale steel, scaled to fit inside the arch. -->
  <g transform="translate(128 128) scale(0.6) translate(-128 -128)" fill="#DDE2EA">
    <!-- Sword: blade, crossguard, grip, pommel. -->
    <path d="M100 18 L112 62 L112 186 L100 200 L88 186 L88 62 Z"/>
    <rect x="62" y="186" width="76" height="13" rx="5"/>
    <rect x="91" y="199" width="18" height="34" rx="3"/>
    <circle cx="100" cy="242" r="10"/>
    <!-- Trident: shaft, collar, fork. -->
    <rect x="151" y="78" width="10" height="164" rx="4"/>
    <rect x="132" y="104" width="48" height="11" rx="4"/>
    <path d="M156 10 L163 36 L176 22 L172 50 L168 50 L168 96 L144 96 L144 50 L140 50 L136 22 L149 36 Z"/>
  </g>
</svg>
